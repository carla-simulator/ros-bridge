openadservice:
  name: carla-manual-control
  # TODO(openads): replace the feature-branch CI image with the release tag (v1.0.0-x.y.z) when releasing.
  image: ghcr.io/openads-project/carla-ros-bridge:latest_feature-carla-1-0_ci
  env:
    # --- name ------
    NAMESPACE: /
    NAME: carla_manual_control
    # --- other -----
    LOG_LEVEL: info
    USE_SIM_TIME: true
    ROLE_NAME: ego_vehicle
    WIRELESS_CONTROLLER: False
    WINDOW_WIDTH: 0
    WINDOW_HEIGHT: 0
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch carla_manual_control carla_manual_control.launch.py \
      log_level:="${LOG_LEVEL}" \
      use_sim_time:="${USE_SIM_TIME}" \
      role_name:=${ROLE_NAME} \
      wireless_controller:=${WIRELESS_CONTROLLER} \
      window_width:=${WINDOW_WIDTH} \
      window_height:=${WINDOW_HEIGHT}
