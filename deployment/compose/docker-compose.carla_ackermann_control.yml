services:

  carla-ackermann-control:
    # TODO(openads): replace the feature-branch CI image with the release tag (v1.0.0-x.y.z) when releasing.
    image: ghcr.io/openads-project/carla-ros-bridge:latest_feature-carla-1-0_ci
    environment:
      # --- name ------
      NAMESPACE: /
      NAME: carla_ackermann_control
      # --- inputs ----
      ACKERMANN_COMMAND_TOPIC: ""
      # --- outputs ---
      VEHICLE_CONTROL_COMMAND_TOPIC: ""
      # --- other -----
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      PARAMS: /docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/settings.yaml
      ROLE_NAME: ego_vehicle
      CONTROL_LOOP_RATE: 0.05
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch carla_ackermann_control carla_ackermann_control.launch.py \
          log_level:="$${LOG_LEVEL}" \
          use_sim_time:="$${USE_SIM_TIME}" \
          params:=$${PARAMS} \
          role_name:=$${ROLE_NAME} \
          control_loop_rate:=$${CONTROL_LOOP_RATE} \
          $${ACKERMANN_COMMAND_TOPIC:+ackermann_command_topic:=$${ACKERMANN_COMMAND_TOPIC}} \
          $${VEHICLE_CONTROL_COMMAND_TOPIC:+vehicle_control_command_topic:=$${VEHICLE_CONTROL_COMMAND_TOPIC}}
    # volumes:
    #   - ./settings.yaml:/docker-ros/ws/install/carla_ackermann_control/share/carla_ackermann_control/settings.yaml
